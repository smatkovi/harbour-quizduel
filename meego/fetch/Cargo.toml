[package]
name = "quizduel-holer"
version = "0.1.0"
edition = "2021"
description = "davinci-Protokoll-Helfer (HTTPS + Krypto) für die MeeGo-Ausgabe von harbour-quizduel"
license = "MIT"

[[bin]]
name = "quizduel-holer"
path = "src/main.rs"

[dependencies]
# Grund für diesen Helfer: Harmattans Qt 4 sitzt auf OpenSSL 0.9.8 und erreicht
# das magbackend (TLS 1.2+) nicht. rustls spricht TLS 1.2/1.3 selbst, webpki-roots
# bringt die Wurzelzertifikate mit (der Gerätespeicher ist von 2011). gzip =
# Transport-Entpackung der Antwort.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "gzip"] }
serde_json = "1"
# davinci-Krypto, reines Rust (kein C): AES-256-CBC/PKCS7, gzip (miniz_oxide), SHA1.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"
sha1 = "0.10"
hex = "0.4"
getrandom = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
